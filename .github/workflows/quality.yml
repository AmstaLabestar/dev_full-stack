name: Quality

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        env:
          DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/hamzadev?schema=public
          AUTH_SECRET: ci-auth-secret-for-build-only
          AUTH_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: admin@portfolio.dev
          ADMIN_PASSWORD: ChangeMe123!
        run: npm run build
